<!-- News card container to be used in news / blog related pages -->
  <div class="news-card">
	  <img src="{{ include.main_image }}" alt="{{ include.main_alt }}" />
	<div class="news-card-content">
		<div class="news-card-title">{{ include.title }}</div>
		<div class="news-card-desc">{{ include.description }}</div>
	</div>
  </div>
<!-- End of news card container -->
